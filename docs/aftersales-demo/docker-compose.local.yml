name: aftersales-demo
# Isolated local dependencies for the AX-200 evaluation. Ports bind to loopback only.
services:
  mysql:
    image: ghcr.io/ageerle/ruoyi-ai-mysql:v3.1.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ruoyi-ai
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - aftersales-mysql:/var/lib/mysql
      - ../script/sql/ruoyi-ai.sql:/docker-entrypoint-initdb.d/01-ruoyi-ai.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: ghcr.io/valkey-io/valkey:8.1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - aftersales-redis:/data
    command: redis-server --appendonly yes

  weaviate:
    image: mirror.gcr.io/semitechnologies/weaviate:1.30.0
    ports:
      - "127.0.0.1:28080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: aftersales
    volumes:
      - aftersales-weaviate:/var/lib/weaviate

  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9090:9090"
    environment:
      MINIO_ROOT_USER: ruoyi
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-ruoyi123}
    command: server /data --console-address ":9090"
    volumes:
      - aftersales-minio:/data

volumes:
  aftersales-mysql:
  aftersales-redis:
  aftersales-weaviate:
  aftersales-minio:
